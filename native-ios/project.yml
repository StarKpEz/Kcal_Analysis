name: KcalAnalysis
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    # Xcode's language mode is 5.0 (not the compiler's 5.9/6.x version).
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Deliberately no development team, Apple ID or signing secret in source.
    DEVELOPMENT_TEAM: ""
targets:
  KcalAnalysis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - KcalAnalysis.entitlements
      # A folder reference preserves relative URLs and the Web directory itself.
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starkpez.kcalanalysis
        PRODUCT_NAME: KcalAnalysis
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/KcalAnalysis.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: HealthKit.framework
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
schemes:
  KcalAnalysis:
    build:
      targets:
        KcalAnalysis: all
    run:
      config: Debug
    archive:
      config: Release
