name: KcalAnalysis
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    # Xcode's language mode is 5.0 (not the compiler's 5.9/6.x version).
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    # Deliberately no development team, Apple ID or signing secret in source.
    DEVELOPMENT_TEAM: ""
targets:
  KcalAnalysis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - KcalAnalysis.entitlements
          # Retained source for the installed 1.0.x container, never linked in 1.1.
          - WebViewController.swift
          - NativeBridge.swift
          - NativeTabBar.swift
      - path: domain/domain.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starkpez.kcalanalysis
        PRODUCT_NAME: KcalAnalysis
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/KcalAnalysis.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: Charts.framework
      - sdk: JavaScriptCore.framework
      - sdk: HealthKit.framework
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
  KcalAnalysisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - NativeBridgeIntegrationTests.swift
    dependencies:
      - target: KcalAnalysis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starkpez.kcalanalysis.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KcalAnalysis.app/KcalAnalysis"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
  KcalAnalysisUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: KcalAnalysis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starkpez.kcalanalysis.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  KcalAnalysis:
    build:
      targets:
        KcalAnalysis: all
        KcalAnalysisTests: [test]
        KcalAnalysisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: KcalAnalysisTests
          parallelizable: false
        - name: KcalAnalysisUITests
          parallelizable: false
    archive:
      config: Release
